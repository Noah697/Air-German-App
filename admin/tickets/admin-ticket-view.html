  <div class="clickable-area">

      <li class="dropdown">
        <a href="#">Routen ▼</a>

<!-- Ticket View Container -->
<div class="ticket-view-container">
  <button id="backBtn" class="back-btn">← Zurück</button>

  <h2>Ticket Details</h2>
  <div id="ticketDetails" class="ticket-details"></div>

  <div class="chat-section">
    <div id="chatMessages" class="chat-messages"></div>

    <textarea id="adminReply" placeholder="Antwort hier eingeben..."></textarea>
    <button id="sendReplyBtn">Senden</button>
  </div>

  <button id="closeTicketBtn" class="close-ticket-btn">Ticket schließen</button>
  <button id="reopenTicketBtn" class="reopen-ticket-btn">Ticket wieder öffnen</button>
</div>

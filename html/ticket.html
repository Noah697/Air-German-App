      </li>
      <li><a href="./livemap.html">Live Map</a></li>
      <li><a href="./livery.html">Liverys</a></li>
      <li><a href="./news.html">News</a></li>

      <!-- Pilot-Icon als Link -->
      <li><a href="../auth/login/login.html" class="icon-link" title="Pilot">✈️</a></li>

      <!-- Ticket-System-Icon -->
      <li><a href="./ticket.html" class="icon-link" title="Tickets">🎫</a></li>

      <!-- Forum -->
      <li><a href="./forum.html" class="icon-link" title="Forum">💬</a></li>
      
      <!-- Einstellungen-Icon als Link -->

    <!-- Fenstersteuerung -->

      <button id="min-btn">−</button>
      <button id="max-btn">□</button>
      <button id="close-btn">×</button>
    </div>
  </div>
</div>

<section class="pilot-ticket-section">
  <h1>Meine Tickets</h1>
  <div class="ticket-header">
    <button id="newTicketBtn">+ Neues Ticket</button>
  </div>
  <div class="ticket-container">
    <table class="ticket-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Datum</th>
          <th>Betreff</th>
          <th>Status</th>
          <th>Aktion</th>
        </tr>
      </thead>
      <tbody id="ticketList">
        <!-- Tickets werden hier geladen -->
      </tbody>
    </table>
  </div>
</section>

<!-- Neues Ticket Modal -->
<div id="newTicketModal" class="modal hidden">
  <div class="modal-content">
    <span id="closeModal" class="close-modal">&times;</span>
    <h3>Neues Ticket erstellen</h3>

    <form id="ticketForm">
      <label for="ticketUser">Name</label>
      <input type="text" id="ticketUser" readonly>

      <label for="ticketDate">Datum</label>
      <input type="text" id="ticketDate" readonly>

      <label for="ticketSubject">Betreff</label>
      <select id="ticketSubject" name="ticketSubject" required>
        <option value="">-- Bitte wählen --</option>
        <option value="bug">Bug Report</option>
        <option value="pilot">Pilot Report</option>
        <option value="suggestion">Vorschlag</option>
        <option value="other">Sonstiges</option>
      </select>

      <div id="dynamicFields"></div>

      <label for="ticketMessage">Nachricht</label>
      <textarea id="ticketMessage" name="ticketMessage" rows="4" required></textarea>

      <button type="submit" class="submit-btn">Ticket öffnen</button>
    </form>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <div class="footer-content">
    <p>© 2025 Air German</p>

      <a href="https://www.instagram.com/airgerman" target="_blank" title="Instagram">📸</a>
    </div>
  </div>
</div>

<script src="../js/ticket.js"></script>
<script src="../js/renderer.js"></script>
<script src="../js/navbar.js"></script>

</body>
</html>

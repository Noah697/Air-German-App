          <li><a href="focus-airport.html">Focus Airport</a></li>
        </ul>
      </li>
      <li><a href="./livemap.html">Live Map</a></li>
      <li><a href="./livery.html">Liverys</a></li>
      <li><a href="./news.html">News</a></li>

      <!-- Pilot-Icon als Link -->
      <li><a href="../auth/login/login.html" class="icon-link" title="Pilot">✈️</a></li>

      <!-- Ticket-System-Icon -->
      <li><a href="./ticket.html" class="icon-link" title="Tickets">🎫</a></li>

      <!-- Forum -->
      <li><a href="./forum.html" class="icon-link" title="Forum">💬</a></li>
      
      <!-- Einstellungen-Icon als Link -->
      <li><a href="./settings.html" class="icon-link" title="Einstellungen">⚙️</a></li>

      <!-- Einstellungen-Icon als Link -->

    </ul>
  </div>

  <div class="nav-icons">
    <!-- Fenstersteuerung -->
    <div class="window-controls">
      <button id="min-btn">−</button>
      <button id="max-btn">□</button>
      <button id="close-btn">×</button>
    </div>
  </div>
</div>


<!-- Inhalt -->
<div class="container">
  <h2>Flug buchen</h2>

  <div class="search-bar">
    <input id="dep" placeholder="Departure">
    <input id="arr" placeholder="Arrival">
    <button id="searchFlights">Search Flights</button>
  </div>

  <table id="flightTable">
    <thead>
      <tr>
        <th>Flight Number</th>
        <th>Callsign</th>
        <th>Departure</th>
        <th>Arrival</th>
        <th>Aircraft</th>
        <th>Flight Level</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="flightTableBody">
      <tr><td colspan="8" style="text-align:center;">Search for flights...</td></tr>
    </tbody>
  </table>
</div>

<!-- Footer -->
<div class="footer">
  <div class="footer-content">
    <p>© 2025 Air German</p>
    <div class="footer-links">
      <a href="https://www.youtube.com/@AirGerman" target="_blank" title="YouTube">📺</a>

  </div>

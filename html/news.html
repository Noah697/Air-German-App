<!-- Header -->
<header class="news-header">
  <h1>Latest News</h1>
  <p>Stay up to date with Air German Virtual</p>
</header>

<!-- News Container -->
<div class="scroll-container">
  <div id="newsContainer" class="news-grid"></div>
</div>

<!-- Overlay -->
<div id="newsOverlay" class="news-overlay">
  <div class="news-overlay-content">
    <button id="closeOverlay" class="close-btn">×</button>
    <h2 id="overlayTitle"></h2>
    <p id="overlayContent"></p>
    <small id="overlayDate"></small>
  </div>
</div>


<!-- Footer -->
<div class="footer">
  <div class="footer-content">
    <p>© 2025 Air German</p>
    <div class="footer-links">
      <a href="https://www.youtube.com/@AirGerman" target="_blank" title="YouTube">📺</a>
      <a href="https://discord.gg/airgerman" target="_blank" title="Discord">💬</a>
      <a href="https://www.instagram.com/airgerman" target="_blank" title="Instagram">📸</a>
    </div>
  </div>
</div>


<script>
  const fs = require('fs');
  const path = require('path');
  const newsPath = path.join(__dirname, '../data/news.json');
  const container = document.getElementById('newsContainer');

  if (!fs.existsSync(newsPath)) {
    fs.writeFileSync(newsPath, JSON.stringify([]));
  }

  const news = JSON.parse(fs.readFileSync(newsPath));
  news.forEach(n => {
    const div = document.createElement('div');
    div.className = 'news-card';
    div.innerHTML = `
      <h3>${n.title}</h3>
      <p>${n.content}</p>
      <small>${n.date}</small>
    `;
    container.appendChild(div);
  });
</script>


<script src="../js/news.js"></script>
<script src="../js/renderer.js"></script>

<script src="../js/titlebar.js"></script>

</body>

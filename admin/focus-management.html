<!-- Navbar -->
<div class="navbar">
  <div class="logo">Air German</div>

  <div class="clickable-area">
    <ul class="nav-links">
      <li><a href="../html/index.html">Home</a></li>
      <li class="dropdown">
        <a href="#">Routen ▼</a>
        <ul class="dropdown-content">
          <li><a href="../html/flight-book.html">Destinations</a></li>
          <li><a href="../html/focus-airport.html">Focus Airport</a></li>
        </ul>
      </li>
      <li><a href="../html/livemap.html">Live Map</a></li>
      <li><a href="../html/livery.html">Liverys</a></li>
      <li><a href="../html/news.html">News</a></li>
      <li><a href="../auth/login/login.html" class="icon-link" title="Pilot">✈️</a></li>
      <li><a href="../html/settings.html" class="icon-link" title="Einstellungen">⚙️</a></li>

      <button id="min-btn">−</button>
      <button id="max-btn">□</button>
      <button id="close-btn">×</button>
    </div>
  </div>
</div>

<!-- Hauptinhalt -->
<div class="scroll-container">
  <div class="admin-container">
    <h1>🛫 Admin Focus Airport Management</h1>

    <form class="news-form" id="focusForm">
      <input type="text" id="name" placeholder="Airport Name (z. B. Barcelona)" required>
      <input type="text" id="icao" placeholder="ICAO Code (z. B. LEBL)" required>
      <input type="text" id="image" placeholder="Bild-Dateiname oder URL (z. B. Barcelona.jpg)" required>
      <button type="submit">Airport hinzufügen</button>
    </form>

    <div class="news-list" id="focusList"></div>
  </div>
</div>

<!-- Footer -->
<footer>
  <p>© 2025 Air German</p>
</footer>

<script src="../js/renderer.js"></script>

<!-- Auto-load Focus Airports -->
<script>
  fetch('../data/focus.airports.json')
    .then(res => {
      if (!res.ok) throw new Error('Could not load focus.airports.json');
      return res.json();
    })
    .then(data => {
      const container = document.querySelector('.focus-airports');
      container.innerHTML = '';

      data.forEach(airport => {
        const div = document.createElement('div');
        div.classList.add('airport');

        // Automatisch Pfad zu assets/pictures/airports mit jpg oder png
        let imgPath = `../assets/pictures/airports/${airport.image}`;
        if (!imgPath.match(/\.(jpg|jpeg|png)$/i)) {
          imgPath += '.jpg'; // Fallback auf .jpg, falls keine Endung angegeben
        }

        div.innerHTML = `
          <div class="circle">
            <img src="${imgPath}" alt="${airport.name}">
            <div class="label">${airport.name} (${airport.icao})</div>
          </div>
        `;
        container.appendChild(div);
      });
    })
    .catch(err => {
      console.error(err);
      document.querySelector('.focus-airports').innerHTML = `
        <p style="color:white;text-align:center;">❌ Unable to load focus airports.</p>
      `;
    });
</script>
